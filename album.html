<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E1716">
<title>Álbum · Boda José de Jesús & Gloria Adriana</title>
<meta property="og:title" content="Boda de José de Jesús & Gloria Adriana">
<meta property="og:description" content="Álbum de fotos · 3 de octubre de 2026 · FORO 7">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/album.css?v=4">
</head>
<body>

<!-- Portada -->
<header class="portada" id="portada">
    <div class="portada-fondo" id="portadaFondo"></div>
    <div class="portada-texto">
        <p class="portada-tipo"   id="albumTipo">Boda</p>
        <h1 class="portada-nombre" id="albumNombre">José de Jesús & Gloria Adriana</h1>
        <span class="portada-linea"></span>
        <p class="portada-titulo" id="albumTitulo">Álbum de fotos</p>
    </div>
    <a class="portada-bajar" href="#galeria" aria-label="Ver fotos">⌄</a>
</header>

<!-- Galería -->
<main id="galeria">
    <div class="galeria" id="albumGrid"></div>
</main>

<!-- Visor a pantalla completa: solo la foto -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto a pantalla completa">
    <img id="visorImg" src="" alt="">
    <button class="visor-zona visor-prev" id="visorPrev" aria-label="Anterior"><span>‹</span></button>
    <button class="visor-zona visor-next" id="visorNext" aria-label="Siguiente"><span>›</span></button>
    <button class="visor-cerrar" id="visorCerrar" aria-label="Cerrar">×</button>
</div>

<footer class="cierre">
    <p class="cierre-nombre" id="cierreNombre"></p>
    <p class="cierre-firma">FORO 7 · Fotografía y Video</p>
</footer>

<script src="js/config.js?v=2"></script>
<script src="js/photos.js?v=4"></script>
<script src="js/supabase-api.js?v=2"></script>
<script src="js/album.js?v=4"></script>
</body>
</html>
